server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed build output of each story: cached for good.
  location ~ ^/[a-z0-9-]+/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # GeoJSON is not in nginx's mime table; scoped here so the rest keeps it.
  location ~ ^/[a-z0-9-]+/content/.+\.geojson$ {
    types { }
    default_type application/geo+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Story content (documents and data) is read at runtime: never cached.
  location ~ ^/[a-z0-9-]+/content/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # /<slug> → /<slug>/, so relative asset URLs resolve.
  location ~ ^/([a-z0-9-]+)$ {
    return 301 $scheme://$http_host/$1/;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
