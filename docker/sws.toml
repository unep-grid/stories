# static-web-server config: https://static-web-server.net/configuration/config-file/
# Plain HTTP on 8080; TLS and HTTP/2 belong to the proxy in front.

[general]
host = "0.0.0.0"
port = 8080
root = "/public"
log-level = "info"

# gzip, brotli or zstd, as the client accepts.
compression = true

# Built-in cache rules: a year for hashed build files (js, css, fonts, images),
# and no-cache on errors, so a 404 for a chunk not yet rolled out is never kept.
# What is read at runtime is set back to no-cache below.
cache-control-headers = true

directory-listing = false
redirect-trailing-slash = true
ignore-hidden-files = true

[advanced]

# Header globs match the served file (/ → /index.html), and `*` crosses `/`.
# Later rules win, over the built-in ones too.
[[advanced.headers]]
source = "**/*.{html,json,geojson}"
[advanced.headers.headers]
Cache-Control = "no-cache"

[[advanced.headers]]
source = "/healthz"
[advanced.headers.headers]
Cache-Control = "no-cache"

# Story content (documents, data, images) is read at runtime: never kept.
[[advanced.headers]]
source = "/*/content/**"
[advanced.headers.headers]
Cache-Control = "no-cache"
